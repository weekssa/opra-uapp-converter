name: Update OPRA presets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/update-presets.yml"

permissions:
  contents: write

concurrency:
  group: opra-preset-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update generated documentation
        run: python src/update_docs.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate presets from OPRA
        run: python src/build_presets.py

      - name: Upload generated presets artifact
        uses: actions/upload-artifact@v4
        with:
          name: opra-uapp-presets
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Commit updated presets and documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output README.md docs/PROJECT_DESCRIPTION.md
          if git diff --cached --quiet; then
            echo "No OPRA preset or documentation changes detected."
          else
            git commit -m "Update OPRA presets and documentation"
            git push
          fi
