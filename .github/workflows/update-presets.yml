name: Update OPRA presets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "src/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/update-presets.yml"

permissions:
  contents: write

concurrency:
  group: opra-preset-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect configured-headphone changes
        id: config
        shell: bash
        run: |
          changed=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [[ -n "$before" && "$before" != "$zero" ]]; then
              if ! git diff --quiet "$before" "$GITHUB_SHA" -- config/targets.json; then
                changed=true
              fi
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Generate presets from OPRA
        run: python src/build_presets.py

      - name: Determine and apply version bump
        id: version
        shell: bash
        run: |
          bump=none
          if [[ "${{ steps.config.outputs.changed }}" == "true" ]]; then
            bump=minor
          elif [[ -n "$(git status --porcelain -- output)" ]]; then
            bump=patch
          fi

          if [[ "$bump" != "none" ]]; then
            python src/update_version.py --bump "$bump"
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version decision: $bump -> v$version"

      - name: Update generated documentation
        run: python src/update_docs.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Upload generated presets artifact
        uses: actions/upload-artifact@v4
        with:
          name: opra-uapp-presets
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Commit updated presets, version, and documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION output README.md docs/PROJECT_DESCRIPTION.md docs/AUTOMATION.md docs/ADDING_HEADPHONES.md
          if git diff --cached --quiet; then
            echo "No OPRA preset, version, or documentation changes detected."
          else
            version="${{ steps.version.outputs.version }}"
            bump="${{ steps.version.outputs.bump }}"
            if [[ "$bump" == "minor" ]]; then
              message="Release v${version}: update configured presets and documentation"
            elif [[ "$bump" == "patch" ]]; then
              message="Release v${version}: update OPRA presets and documentation"
            else
              message="Update generated project documentation"
            fi
            git commit -m "$message"
            git push
          fi

      - name: Publish version tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          bump="${{ steps.version.outputs.bump }}"
          tag="v${version}"
          archive="opra-uapp-presets-${tag}.zip"
          checksum="${archive}.sha256"

          git fetch --tags origin

          if git rev-parse "$tag" >/dev/null 2>&1; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            head_sha="$(git rev-parse HEAD)"
            if [[ "$bump" != "none" && "$tagged_sha" != "$head_sha" ]]; then
              echo "Existing tag $tag points to $tagged_sha instead of release commit $head_sha." >&2
              exit 1
            fi
            echo "Tag $tag already exists."
          else
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
            exit 0
          fi

          export archive
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("output")
          archive = Path(os.environ["archive"])
          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as bundle:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      bundle.write(path, path.relative_to(root).as_posix())
          PY

          sha256sum "$archive" > "$checksum"
          gh release create "$tag" \
            "$archive#UAPP preset bundle ($tag)" \
            "$checksum#SHA-256 checksum" \
            "output/manifest.json#Preset manifest" \
            --verify-tag \
            --title "$tag" \
            --generate-notes
